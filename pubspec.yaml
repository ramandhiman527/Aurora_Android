name: intelligent_raman
description: A premium, minimal ecommerce mobile application for fashion, shoes, and accessories.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # Fonts and Icons
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0

  # UI Helper Libraries
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  badges: ^3.1.2

  # Networking & DI
  dio: ^5.4.0
  get_it: ^7.6.0

  # Utility
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Custom assets and fonts can be declared here as needed
  assets:
    - assets/images/
    - assets/icons/
